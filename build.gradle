// This is a minimal setup of a Forge mod workspace.
// For complex examples (including AccessTransformers, Jar-in-Jar, and Mixin), see our examples repository.
// https://github.com/MinecraftForge/MDKExamples

plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[7.0.17,8)'
}

version = '1.0.0'
group = 'net.lukario.circleofinevitability'

// Mojang ships Java 25 to end users in 26.1+, so your mod should target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// Include generated resources
sourceSets.main.resources { srcDir 'src/generated/resources' }

minecraft {
    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')

            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
            systemProperty 'forge.enabledGameTestNamespaces', 'circle_of_inevitability'
        }

        register('client') {
            args '--mixin.config', 'circle_of_inevitability.camera.mixins.json'
        }

        register('server') {
            args '--nogui'
        }

        register('gameTestServer') {
            if (providers.gradleProperty('mountTests').isPresent()) { args '--tests', 'circle_of_inevitability:mount_*' }
            if (providers.gradleProperty('inevitabilityArmorTests').isPresent()) {
                workingDir = layout.buildDirectory.dir('inevitability-armor-gametest')
                args '--tests', 'circle_of_inevitability:inevitability_armor_*'
            }
            if (providers.gradleProperty('unshadowedArmorTests').isPresent()) {
                workingDir = layout.buildDirectory.dir('unshadowed-armor-gametest')
                args '--tests', 'circle_of_inevitability:unshadowed_armor_*'
            }
            if (providers.gradleProperty('grayFogArmorTests').isPresent()) {
                workingDir = layout.buildDirectory.dir('gray-fog-armor-gametest')
                args '--tests', 'circle_of_inevitability:gray_fog_armor_*'
            }
            if (providers.gradleProperty('deathArmorTests').isPresent()) {
                workingDir = layout.buildDirectory.dir('death-armor-gametest')
                args '--tests', 'circle_of_inevitability:death_armor_*'
            }
            if (providers.gradleProperty('ritualTests').isPresent()) { args '--tests', 'circle_of_inevitability:ritual_*' }
            if (providers.gradleProperty('keyOfStarsTests').isPresent()) { args '--tests', 'circle_of_inevitability:key_of_stars_*' }
            if (providers.gradleProperty('cameraTests').isPresent()) { args '--tests', 'circle_of_inevitability:camera_*' }
            if (providers.gradleProperty('darkAngelTests').isPresent()) { args '--tests', 'circle_of_inevitability:dark_angel_*' }
            if (providers.gradleProperty('conquerorComboTests').isPresent()) { args '--tests', 'circle_of_inevitability:conqueror_ability_combos' }
            if (providers.gradleProperty('filthyMonarchTests').isPresent()) { args '--tests', 'circle_of_inevitability:filthy_monarch_*' }
            if (providers.gradleProperty('natureWalkerTests').isPresent()) { args '--tests', 'circle_of_inevitability:nature_walker_*' }
            if (providers.gradleProperty('apocalypseTests').isPresent()) {
                args '--tests', 'circle_of_inevitability:apocalypse_*'
            }
            if (providers.gradleProperty('authorTests').isPresent()) { args '--tests', 'circle_of_inevitability:author_*' }
            if (providers.gradleProperty('whiteAngelTests').isPresent()) { args '--tests', 'circle_of_inevitability:white_angel_*' }
            if (providers.gradleProperty('thunderGodTests').isPresent()) {
                args '--tests', 'circle_of_inevitability:thunder_*'
            }
            if (providers.gradleProperty('friendTests').isPresent()) {
                args '--tests', 'circle_of_inevitability:friend_*'
            }
            // Focus this encounter's regressions without running unrelated pathway suites.
            if (providers.gradleProperty('omniscientEyeTests').isPresent()) {
                args '--tests', 'circle_of_inevitability:omniscient_*'
            }
            if (providers.gradleProperty('creepingHungerTests').isPresent()) {
                workingDir = layout.buildDirectory.dir('creeping-hunger-gametest')
                args '--tests', 'circle_of_inevitability:creeping_hunger_*'
            }
            if (providers.gradleProperty('artifactTests').isPresent()) {
                workingDir = layout.buildDirectory.dir('artifact-gametest')
                args '--tests', 'circle_of_inevitability:artifact_*'
            }
            if (providers.gradleProperty('starDragonBossTests').isPresent()) {
                args '--tests', 'circle_of_inevitability:star_dragon_boss_*'
            }
        }

        register('data') {
            workingDir = layout.projectDirectory.dir('run-data')

            args '--mod', 'circle_of_inevitability', '--all', '--output', layout.projectDirectory.dir('src/generated/resources'), '--existing', layout.projectDirectory.dir('src/main/resources')
        }
    }
}

repositories {
    minecraft.mavenizer(it) // In Kotlin, it = this
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency('net.minecraftforge:forge:26.2-65.1.0')
    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.5'
}

tasks.named('jar', Jar) {
    manifest {
        attributes([
            'MixinConfigs'          : 'circle_of_inevitability.camera.mixins.json',
            'Specification-Title'     : 'circle_of_inevitability',
            'Specification-Vendor'    : 'Lukario2401',
            'Specification-Version'   : '1',
            'Implementation-Title'    : 'Circle Of Inevitability',
            'Implementation-Version'  : version,
            'Implementation-Vendor'   : 'Lukario2401'
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    // Use the UTF-8 charset for Java compilation
    // This is done by default in Java 18+, but this ensures it no matter the Java or Gradle version
    options.encoding = 'UTF-8'
}

// Standalone data and serialization checks; no Minecraft client or server needs to start.
sourceSets {
    armorModelTest {
        java.srcDir 'tools/tests'
        java.include 'InevitabilityArmorModelTest.java', 'UnshadowedArmorModelTest.java', 'GrayFogArmorModelTest.java', 'DeathArmorModelTest.java'
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    damageFxTest {
        java.srcDir 'tools/tests'
        java.include 'DamageFxTest.java'
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    swingEditTest {
        java.srcDir 'tools/tests'
        java.include 'SwingAnimationEditsTest.java'
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

tasks.register('damageFxTest', JavaExec) {
    group = 'verification'
    description = 'Checks cumulative damage isolation, inactivity resets and particle serialization.'
    dependsOn tasks.named('damageFxTestClasses')
    classpath = sourceSets.damageFxTest.runtimeClasspath
    mainClass = 'net.lukario.circleofinevitability.combat.DamageFxTest'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
}

tasks.register('swingAnimationEditsTest', JavaExec) {
    group = 'verification'
    description = 'Checks swing edits, validation, JSON round trips and compilable Java exports.'
    dependsOn tasks.named('swingEditTestClasses')
    classpath = sourceSets.swingEditTest.runtimeClasspath
    mainClass = 'net.lukario.circleofinevitability.client.animation.SwingAnimationEditsTest'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
}

tasks.register('armorModelTest', JavaExec) {
    group = 'verification'
    description = 'Bakes all four armor rigs and checks slot isolation, idle motion and attack endpoints.'
    dependsOn tasks.named('armorModelTestClasses')
    classpath = sourceSets.armorModelTest.runtimeClasspath
    mainClass = 'net.lukario.circleofinevitability.client.armor.InevitabilityArmorModelTest'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
}

tasks.register('unshadowedArmorModelTest', JavaExec) {
    group = 'verification'
    description = 'Bakes the Unshadowed armor rigs and checks slot isolation, halo, spear orbit and strike endpoints.'
    dependsOn tasks.named('armorModelTestClasses')
    classpath = sourceSets.armorModelTest.runtimeClasspath
    mainClass = 'net.lukario.circleofinevitability.client.armor.UnshadowedArmorModelTest'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
}

tasks.register('grayFogArmorModelTest', JavaExec) {
    group = 'verification'
    description = 'Bakes the Gray Fog armor rigs and checks slot isolation, coat tail sway and the figurine.'
    dependsOn tasks.named('armorModelTestClasses')
    classpath = sourceSets.armorModelTest.runtimeClasspath
    mainClass = 'net.lukario.circleofinevitability.client.armor.GrayFogArmorModelTest'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
}

tasks.register('deathArmorModelTest', JavaExec) {
    group = 'verification'
    description = 'Bakes the Death armor rigs and checks slot isolation, the atlas, and the cape, jaw, heart and shroud animations.'
    dependsOn tasks.named('armorModelTestClasses')
    classpath = sourceSets.armorModelTest.runtimeClasspath
    mainClass = 'net.lukario.circleofinevitability.client.armor.DeathArmorModelTest'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
}

tasks.named('check') { dependsOn tasks.named('swingAnimationEditsTest'), tasks.named('damageFxTest'), tasks.named('armorModelTest'), tasks.named('unshadowedArmorModelTest'), tasks.named('grayFogArmorModelTest'), tasks.named('deathArmorModelTest') }

// Forge merges classes/resources into one directory. Resource-copy output cleanup must finish
// before Java's up-to-date check; otherwise an asset-only edit can erase already-compiled mixins.
sourceSets.configureEach { sourceSet ->
    tasks.named(sourceSet.compileJavaTaskName) {
        dependsOn tasks.named(sourceSet.processResourcesTaskName)
    }
}
