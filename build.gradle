// This is a minimal setup of a Forge mod workspace.
// For complex examples (including AccessTransformers, Jar-in-Jar, and Mixin), see our examples repository.
// https://github.com/MinecraftForge/MDKExamples

plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[7.0.17,8)'
}

version = '1.0.0'
group = 'net.lukario.circleofinevitability'

// Mojang ships Java 25 to end users in 26.1+, so your mod should target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// Include generated resources
sourceSets.main.resources { srcDir 'src/generated/resources' }

minecraft {
    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')

            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
            systemProperty 'forge.enabledGameTestNamespaces', 'circle_of_inevitability'
        }

        register('client')

        register('server') {
            args '--nogui'
        }

        register('gameTestServer') {
            // Focus this encounter's regressions without running unrelated pathway suites.
            if (providers.gradleProperty('omniscientEyeTests').isPresent()) {
                args '--tests', 'circle_of_inevitability:omniscient_*'
            }
            if (providers.gradleProperty('starDragonBossTests').isPresent()) {
                args '--tests', 'circle_of_inevitability:star_dragon_boss_*'
            }
        }

        register('data') {
            workingDir = layout.projectDirectory.dir('run-data')

            args '--mod', 'circle_of_inevitability', '--all', '--output', layout.projectDirectory.dir('src/generated/resources'), '--existing', layout.projectDirectory.dir('src/main/resources')
        }
    }
}

repositories {
    minecraft.mavenizer(it) // In Kotlin, it = this
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency('net.minecraftforge:forge:26.2-65.1.0')
    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.5'
}

tasks.named('jar', Jar) {
    manifest {
        attributes([
            'Specification-Title'     : 'circle_of_inevitability',
            'Specification-Vendor'    : 'Lukario2401',
            'Specification-Version'   : '1',
            'Implementation-Title'    : 'Circle Of Inevitability',
            'Implementation-Version'  : version,
            'Implementation-Vendor'   : 'Lukario2401'
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    // Use the UTF-8 charset for Java compilation
    // This is done by default in Java 18+, but this ensures it no matter the Java or Gradle version
    options.encoding = 'UTF-8'
}

// Pure animation data tests; no Minecraft client or server needs to start.
sourceSets {
    swingEditTest {
        java.srcDir 'tools/tests'
        java.include 'SwingAnimationEditsTest.java'
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

tasks.register('swingAnimationEditsTest', JavaExec) {
    group = 'verification'
    description = 'Checks swing edits, validation, JSON round trips and compilable Java exports.'
    dependsOn tasks.named('swingEditTestClasses')
    classpath = sourceSets.swingEditTest.runtimeClasspath
    mainClass = 'net.lukario.circleofinevitability.client.animation.SwingAnimationEditsTest'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
}

tasks.named('check') { dependsOn tasks.named('swingAnimationEditsTest') }
